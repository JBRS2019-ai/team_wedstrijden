<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <title>Wedstrijdschema</title>

  <script src="https://cdn.jsdelivr.net/npm/ical.js/build/ical.min.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 720px;
      margin: 0 auto;
      padding: 16px;
      background: #f4f6f8;
    }

    h1 {
      text-align: center;
      margin-bottom: 10px;
    }

    .next {
      background: #1f6feb;
      color: white;
      padding: 14px;
      border-radius: 14px;
      margin-bottom: 18px;
    }

    .next small {
      opacity: 0.8;
      display: block;
      margin-bottom: 4px;
    }

    .wedstrijd {
      background: white;
      border-radius: 14px;
      padding: 14px 16px;
      margin-bottom: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
      display: flex;
      gap: 12px;
    }

    .datebox {
      min-width: 70px;
      text-align: center;
      background: #eef2ff;
      border-radius: 10px;
      padding: 8px;
      font-weight: bold;
      color: #2b3a67;
    }

    .day { font-size: 18px; }
    .month { font-size: 12px; text-transform: uppercase; }

    .content { flex: 1; }

    .time {
      font-weight: bold;
      margin-bottom: 4px;
    }

    .title {
      font-size: 15px;
      margin-bottom: 4px;
    }

    .badge {
      display: inline-block;
      font-size: 12px;
      padding: 2px 8px;
      border-radius: 999px;
      margin-top: 4px;
    }

    .home { background: #e6f7ec; color: #1b7f3a; }
    .away { background: #ffecec; color: #b42318; }

    .loc {
      font-size: 12px;
      color: #666;
      margin-top: 6px;
      cursor: pointer;
    }

    .highlight {
      border: 2px solid #1f6feb;
    }
  </style>
</head>

<body>

<h1>Wedstrijdschema</h1>

<div id="next"></div>
<div id="wedstrijden"></div>

<script>
async function loadCalendar() {

  const url =
    "https://corsproxy.io/?https://api.foys.io/competition/public-api/v1/teams/1ee7d4f7-92fc-40ac-b0c1-f744d3b7d7f6/ics";

  const response = await fetch(url);
  const icsText = await response.text();

  const jcalData = ICAL.parse(icsText);
  const comp = new ICAL.Component(jcalData);

  const events = comp.getAllSubcomponents("vevent");

  let parsedEvents = events.map(ev => {

    const e = new ICAL.Event(ev);

    const summary = e.summary.replaceAll("MBeeBallU12-1", "").trim();

    const teams = summary.split("-").map(s => s.trim());

    const isHome = teams.length > 1
      ? teams[0].includes("The Bears")
      : false;

    return {
      summary,
      date: e.startDate.toJSDate(),
      isHome
    };
  });

  // 🔥 HARD CODE EVENT (7 juni)
  parsedEvents.push({
    summary: "Landelijke Beeball Dag – Hoofddorp",
    date: new Date("2026-06-07T10:00:00"),
    isHome: true,
    location: "Sportpark 21, Nieuwe Molenaarslaan 10, 2134 AS Hoofddorp"
  });

  parsedEvents.sort((a, b) => a.date - b.date);

  const now = new Date();
  const nextGame = parsedEvents.find(e => e.date > now);

  // NEXT GAME BOX
  if (nextGame) {
    document.getElementById("next").innerHTML = `
      <div class="next">
        <small>Volgende wedstrijd</small>
        <strong>${nextGame.summary}</strong><br>
        ${nextGame.date.toLocaleDateString("nl-NL")} —
        ${nextGame.date.toLocaleTimeString("nl-NL", {
          hour: "2-digit",
          minute: "2-digit"
        })}
      </div>
    `;
  }

  const container = document.getElementById("wedstrijden");

  parsedEvents.forEach(item => {

    const d = item.date;

    const month = d.toLocaleDateString("nl-NL", { month: "short" });
    const day = d.getDate();

    const isNext = nextGame && item.date.getTime() === nextGame.date.getTime();

    const mapsLink = "https://www.google.com/maps/search/?api=1&query=" +
      encodeURIComponent(item.location || item.summary);

    const div = document.createElement("div");
    div.className = "wedstrijd" + (isNext ? " highlight" : "");

    div.innerHTML = `
      <div class="datebox">
        <div class="day">${day}</div>
        <div class="month">${month}</div>
      </div>

      <div class="content">
        <div class="time">
          ${d.toLocaleTimeString("nl-NL", {
            hour: "2-digit",
            minute: "2-digit"
          })}
        </div>

        <div class="title">${item.summary}</div>

        <div class="badge ${item.isHome ? "home" : "away"}">
          ${item.isHome ? "Thuis" : "Uit"}
        </div>

        ${item.location ? `
          <div class="loc" onclick="window.open('${mapsLink}', '_blank')">
            📍 ${item.location}
          </div>
        ` : ""}
      </div>
    `;

    container.appendChild(div);
  });
}

loadCalendar();
</script>

</body>
</html>
