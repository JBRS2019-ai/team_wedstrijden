<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <title>Wedstrijdschema</title>

  <script src="https://cdn.jsdelivr.net/npm/ical.js/build/ical.min.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 700px;
      margin: 0 auto;
      padding: 20px;
      background: #f5f5f5;
    }

    h1 {
      text-align: center;
    }

    .wedstrijd {
      background: white;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 12px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.08);
    }

    .datum {
      font-weight: bold;
      margin-bottom: 6px;
    }
  </style>
</head>

<body>

<h1>Wedstrijdschema</h1>

<div id="wedstrijden"></div>

<script>
async function loadCalendar() {

  const url =
    "https://api.foys.io/competition/public-api/v1/teams/1ee7d4f7-92fc-40ac-b0c1-f744d3b7d7f6/ics";

  const response = await fetch(url);
  const icsText = await response.text();

  const jcalData = ICAL.parse(icsText);
  const comp = new ICAL.Component(jcalData);

  const events = comp.getAllSubcomponents("vevent");

  const container = document.getElementById("wedstrijden");

  events.forEach(event => {

    const e = new ICAL.Event(event);

    const date = e.startDate.toJSDate();

    const div = document.createElement("div");

    div.className = "wedstrijd";

    div.innerHTML = `
      <div class="datum">
        ${date.toLocaleDateString("nl-NL")} —
        ${date.toLocaleTimeString("nl-NL", {
          hour: "2-digit",
          minute: "2-digit"
        })}
      </div>

      <div>${e.summary}</div>
    `;

    container.appendChild(div);
  });
}

loadCalendar();
</script>

</body>
</html>
